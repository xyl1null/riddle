[package]
name = "riddle"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tom Riddle's diary app for macOS and reMarkable experiments"

[dependencies]
libc = "0.2"
signal-hook = "0.3"
png = "0.17"
ab_glyph = "0.2"
serde_json = "1"
# HTTP + TLS for the OpenAI-compatible oracle backend. Pure Rust (rustls), no
# OpenSSL/C — keeps the binary self-contained and cross-compiles cleanly.
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
minifb = "0.28"

[features]
# Link libquill.so (vendor e-ink engine C ABI) for full-takeover mode.
takeover = []

[profile.release]
strip = true
lto = true
